# SPDX-License-Identifier: GPL-3.0-or-later
name: Release

on:
  push:
    tags: ['v*\+noctalia.*']

permissions:
  contents: read

jobs:
  version:
    name: Check the Noctalia release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+noctalia\.[0-9]+$ || "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Expected a Noctalia tag matching Cargo.toml ($version), got $GITHUB_REF_NAME"
            exit 1
          fi

  build:
    name: Build and test Linux packages
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      linux_only: true

  draft:
    name: Draft the Noctalia release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: files
      - name: Add the checked Linux packages to a draft
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: files
        run: |
          version=${GITHUB_REF_NAME#v}
          assets=(
            "nectarlink_${version}_amd64.deb"
            "nectarlink-${version}-1.x86_64.rpm"
            "Nectarlink-${version}-x86_64.AppImage"
            "Nectarlink-${version}-linux-x86_64.tar.gz"
            install.sh
          )
          # Keep filenames URL-safe; the tag and the versions inside the
          # packages retain the Cargo version (including the "+").
          release_assets=()
          for asset in "${assets[@]}"; do
            name=${asset//+/-}
            if [[ "$asset" != "$name" ]]; then mv -- "$asset" "$name"; fi
            release_assets+=("$name")
          done
          sha256sum "${release_assets[@]}" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "NectarLink для Noctalia ${version}" \
            --notes "Linux x86-64: установщик, .deb, .rpm, AppImage и архив. См. [руководство](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/README.md) и [изменения](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/CHANGES.md). Проверены сборка, запуск пакетов и работа установщика в CI; проверка на реальном телефоне не проводилась."
